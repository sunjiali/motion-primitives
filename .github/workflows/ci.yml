name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'site/lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'site/lib/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all JavaScript
        run: |
          set -e
          for f in $(find src site -name '*.js' -not -path '*/node_modules/*'); do
            echo "checking $f"
            node --check "$f"
          done

      - name: Install Chrome for the smoke render
        run: |
          npx -y @puppeteer/browsers install chrome@stable --path "$HOME/.cache/puppeteer" | tee /tmp/chrome-install.txt
          CHROME_BIN=$(awk '/^chrome@/ {print $2}' /tmp/chrome-install.txt | tail -1)
          test -x "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Smoke render (one showcase still)
        run: |
          node src/render.js --comp showcase --still 60 --out /tmp/smoke.png
          test -s /tmp/smoke.png
          SIZE=$(stat -c%s /tmp/smoke.png)
          echo "smoke.png: $SIZE bytes"
          test "$SIZE" -gt 10000
